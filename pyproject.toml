[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-robot"
version = "1.0.0"
description = "Observable terminal automation for Xiaohongshu web interactions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "openai==2.52.0",
  "playwright==1.58.0",
  "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
include = ["xhs_robot*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
