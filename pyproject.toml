[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "puppy"
version = "1.0.0"
description = "Observable terminal automation for Xiaohongshu web interactions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi==0.115.6",
  "openai==2.52.0",
  "playwright==1.58.0",
  "python-dotenv==1.2.2",
  "uvicorn==0.34.0",
]

[tool.setuptools.packages.find]
include = ["puppy*"]

[tool.setuptools.package-data]
"puppy.web" = ["public/*.html", "public/*.js", "public/*.css"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
